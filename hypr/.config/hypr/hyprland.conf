# #######################################################################################
# AUTOGENERATED HYPRLAND CONFIG.
# EDIT THIS CONFIG ACCORDING TO THE WIKI INSTRUCTIONS.
# #######################################################################################



# This is an example Hyprland config file.
# Refer to the wiki for more information.
# https://wiki.hypr.land/Configuring/

# Please note not all available settings / options are set here.
# For a full list, see the wiki

# You can split this configuration into multiple files
# Create your files separately and then link them to this file like this:
# source = ~/.config/hypr/myColors.conf


################
### MONITORS ###
################

# See https://wiki.hypr.land/Configuring/Monitors/
monitor=DP-2,3440x1440@144,0x0,1
monitor=HDMI-A-1,3440x1440@99.98,0x0,1

# Theme palette ($nord0..$nord15) — generated by `theme-switch`
source = ~/.config/theme/hypr-colors.conf


###################
### MY PROGRAMS ###
###################

# See https://wiki.hypr.land/Configuring/Keywords/

# Set programs that you use
$terminal = ghostty
$fileManager = dolphin
$menu = pkill wofi || wofi --show drun


#################
### AUTOSTART ###
#################

# Autostart necessary processes (like notifications daemons, status bars, etc.)
# Or execute your favorite apps at launch like this:

# exec-once = $terminal
# exec-once = nm-applet &
# exec-once = waybar & hyprpaper & firefox
exec-once = quickshell


#############################
### ENVIRONMENT VARIABLES ###
#############################

# See https://wiki.hypr.land/Configuring/Environment-variables/

env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24
env = QT_QPA_PLATFORMTHEME,kde


###################
### PERMISSIONS ###
###################

# See https://wiki.hypr.land/Configuring/Permissions/
# Please note permission changes here require a Hyprland restart and are not applied on-the-fly
# for security reasons

# ecosystem {
#   enforce_permissions = 1
# }

# permission = /usr/(bin|local/bin)/grim, screencopy, allow
# permission = /usr/(lib|libexec|lib64)/xdg-desktop-portal-hyprland, screencopy, allow
# permission = /usr/(bin|local/bin)/hyprpm, plugin, allow


#####################
### LOOK AND FEEL ###
#####################

# Refer to https://wiki.hypr.land/Configuring/Variables/

# https://wiki.hypr.land/Configuring/Variables/#general
general {
    gaps_in = 4
    gaps_out = 8

    border_size = 2

    # https://wiki.hypr.land/Configuring/Variables/#variable-types for info about colors
    # Nord: frost cyan -> frost blue gradient on active, muted polar night on inactive
    col.active_border = $nord8 $nord10 45deg
    col.inactive_border = $nord2

    # Set to true enable resizing windows by clicking and dragging on borders and gaps
    resize_on_border = false

    # Please see https://wiki.hypr.land/Configuring/Tearing/ before you turn this on
    allow_tearing = false

    layout = dwindle
}

# https://wiki.hypr.land/Configuring/Variables/#decoration
decoration {
    rounding = 10
    rounding_power = 2

    # Change transparency of focused and unfocused windows
    active_opacity = 1.0
    inactive_opacity = 1.0

    shadow {
        enabled = true
        range = 4
        render_power = 3
        color = rgba(1a1a1aee)
    }

    # https://wiki.hypr.land/Configuring/Variables/#blur
    blur {
        enabled = true
        size = 3
        passes = 1

        vibrancy = 0.1696
    }
}

# https://wiki.hypr.land/Configuring/Variables/#animations
animations {
    enabled = yes, please :)

    # Default curves, see https://wiki.hypr.land/Configuring/Animations/#curves
    #        NAME,           X0,   Y0,   X1,   Y1
    bezier = easeOutQuint,   0.23, 1,    0.32, 1
    bezier = easeInOutCubic, 0.65, 0.05, 0.36, 1
    bezier = linear,         0,    0,    1,    1
    bezier = almostLinear,   0.5,  0.5,  0.75, 1
    bezier = quick,          0.15, 0,    0.1,  1

    # Default animations, see https://wiki.hypr.land/Configuring/Animations/
    #           NAME,          ONOFF, SPEED, CURVE,        [STYLE]
    animation = global,        1,     10,    default
    animation = border,        1,     5.39,  easeOutQuint
    animation = windows,       1,     4.79,  easeOutQuint
    animation = windowsIn,     1,     4.1,   easeOutQuint, popin 87%
    animation = windowsOut,    1,     1.49,  linear,       popin 87%
    animation = fadeIn,        1,     1.73,  almostLinear
    animation = fadeOut,       1,     1.46,  almostLinear
    animation = fade,          1,     3.03,  quick
    animation = layers,        1,     2.4,   easeOutQuint
    animation = layersIn,      1,     2.4,   easeOutQuint, fade
    animation = layersOut,     1,     1.5,   linear,       fade
    animation = fadeLayersIn,  1,     1.79,  almostLinear
    animation = fadeLayersOut, 1,     1.39,  almostLinear
    animation = workspaces,    1,     2.8,   almostLinear, slidefade
    animation = workspacesIn,  1,     1.75,  almostLinear, slidefade
    animation = workspacesOut, 1,     2.8,   almostLinear, slidefade
    animation = zoomFactor,    1,     7,     quick
}

# Ref https://wiki.hypr.land/Configuring/Workspace-Rules/
# "Smart gaps" / "No gaps when only"
# uncomment all if you wish to use that.
# workspace = w[tv1], gapsout:0, gapsin:0
# workspace = f[1], gapsout:0, gapsin:0
# windowrule {
#     name = no-gaps-wtv1
#     match:float = false
#     match:workspace = w[tv1]
#
#     border_size = 0
#     rounding = 0
# }
#
# windowrule {
#     name = no-gaps-f1
#     match:float = false
#     match:workspace = f[1]
#
#     border_size = 0
#     rounding = 0
# }

# See https://wiki.hypr.land/Configuring/Dwindle-Layout/ for more
dwindle {
preserve_split = true # You probably want this
}

# See https://wiki.hypr.land/Configuring/Master-Layout/ for more
master {
    new_status = master
}

# https://wiki.hypr.land/Configuring/Variables/#misc
misc {
    force_default_wallpaper = -1 # Set to 0 or 1 to disable the anime mascot wallpapers
    disable_hyprland_logo = false # If true disables the random hyprland logo / anime girl background. :(
}


#############
### INPUT ###
#############

# https://wiki.hypr.land/Configuring/Variables/#input
input {
    kb_layout = us
    kb_variant =
    kb_model =
    kb_options =
    kb_rules =

    follow_mouse = 1

    sensitivity = 0 # -1.0 - 1.0, 0 means no modification.

    touchpad {
        natural_scroll = false
    }
}

# See https://wiki.hypr.land/Configuring/Gestures
gesture = 3, horizontal, workspace

# Example per-device config
# See https://wiki.hypr.land/Configuring/Keywords/#per-device-input-configs for more
device {
    name = epic-mouse-v1
    sensitivity = -0.5
}


###################
### KEYBINDINGS ###
###################

# See https://wiki.hypr.land/Configuring/Keywords/
$mainMod = SUPER # Sets "Windows" key as main modifier

# Example binds, see https://wiki.hypr.land/Configuring/Binds/ for more
#
# Every bind is a `bindd` (or bindmd/bindeld/bindld): the third field is a
# description, "Group: what it does" (no commas). `hyprctl binds -j` reports it and
# the quickshell keys cheatsheet (SUPER+/) groups its columns by the part before
# the colon. Groups: Agents, Apps, Shell, Windows, Workspaces, Notifications,
# Capture, Media, Session.
bindd = $mainMod, Q, Apps: Terminal, exec, $terminal
bindd = $mainMod, C, Windows: Close window, killactive,
bindd = $mainMod, M, Session: Power menu, exec, powermenu
bindd = $mainMod, Escape, Session: Power menu, exec, powermenu
bindd = $mainMod CTRL, L, Session: Lock screen, exec, loginctl lock-session # lock (hypridle runs hyprlock)
bindd = $mainMod, E, Apps: File manager, exec, $fileManager
bindd = $mainMod, V, Windows: Toggle floating, togglefloating,
bindd = $mainMod, F, Windows: Maximise, fullscreen, 1
bindd = $mainMod SHIFT, F, Windows: Fullscreen, fullscreen, 0
bindd = $mainMod, R, Apps: Launcher, exec, $menu
bindd = $mainMod SHIFT, S, Capture: Screenshot, exec, flameshot gui
bindd = $mainMod ALT, S, Capture: Record full screen, exec, screen-record # toggle full-screen recording
bindd = $mainMod CTRL, S, Capture: Record a region, exec, screen-record --region # record a selected area
bindd = $mainMod, W, Shell: Toggle bar, global, quickshell:togglebar
bindd = $mainMod SHIFT, W, Shell: Dashboard, global, quickshell:toggledashboard

# Agent board (docs/agent-board.md): quickshell roster, checklist wall, keys cheatsheet
bindd = $mainMod, G, Agents: Roster, global, quickshell:roster
bindd = $mainMod SHIFT, G, Agents: Checklist wall, global, quickshell:wall
bindd = $mainMod, slash, Agents: Keys cheatsheet, global, quickshell:keys
bindd = $mainMod, N, Agents: Jump to what needs you, exec, board next
bindd = $mainMod, down, Windows: Toggle split, layoutmsg, togglesplit # dwindle

# Move focus with mainMod + hjkl (vim-style)
bindd = $mainMod, H, Windows: Focus left, movefocus, l
bindd = $mainMod, L, Windows: Focus right, movefocus, r
bindd = $mainMod, K, Windows: Focus up, movefocus, u
bindd = $mainMod, J, Windows: Focus down, movefocus, d

# Switch workspaces with mainMod + [0-9]
bindd = $mainMod, 1, Workspaces: Go to workspace 1, workspace, 1
bindd = $mainMod, 2, Workspaces: Go to workspace 2, workspace, 2
bindd = $mainMod, 3, Workspaces: Go to workspace 3, workspace, 3
bindd = $mainMod, 4, Workspaces: Go to workspace 4, workspace, 4
bindd = $mainMod, 5, Workspaces: Go to workspace 5, workspace, 5
bindd = $mainMod, 6, Workspaces: Go to workspace 6, workspace, 6
bindd = $mainMod, 7, Workspaces: Go to workspace 7, workspace, 7
bindd = $mainMod, 8, Workspaces: Go to workspace 8, workspace, 8
bindd = $mainMod, 9, Workspaces: Go to workspace 9, workspace, 9
bindd = $mainMod, 0, Workspaces: Go to workspace 10, workspace, 10

# Move active window to a workspace with mainMod + SHIFT + [0-9]
bindd = $mainMod SHIFT, 1, Workspaces: Move window to workspace 1, movetoworkspace, 1
bindd = $mainMod SHIFT, 2, Workspaces: Move window to workspace 2, movetoworkspace, 2
bindd = $mainMod SHIFT, 3, Workspaces: Move window to workspace 3, movetoworkspace, 3
bindd = $mainMod SHIFT, 4, Workspaces: Move window to workspace 4, movetoworkspace, 4
bindd = $mainMod SHIFT, 5, Workspaces: Move window to workspace 5, movetoworkspace, 5
bindd = $mainMod SHIFT, 6, Workspaces: Move window to workspace 6, movetoworkspace, 6
bindd = $mainMod SHIFT, 7, Workspaces: Move window to workspace 7, movetoworkspace, 7
bindd = $mainMod SHIFT, 8, Workspaces: Move window to workspace 8, movetoworkspace, 8
bindd = $mainMod SHIFT, 9, Workspaces: Move window to workspace 9, movetoworkspace, 9
bindd = $mainMod SHIFT, 0, Workspaces: Move window to workspace 10, movetoworkspace, 10

# Example special workspace (scratchpad)
bindd = $mainMod, A, Workspaces: Magic workspace, togglespecialworkspace, magic
bindd = $mainMod SHIFT, A, Workspaces: Move window to magic, movetoworkspace, special:magic

# Mako notifications: dismiss top / dismiss all
bindd = $mainMod, space, Notifications: Dismiss, exec, makoctl dismiss
bindd = $mainMod, space, Notifications: Dismiss board toast, global, quickshell:dismisstoast
bindd = $mainMod SHIFT, space, Notifications: Dismiss all, exec, makoctl dismiss --all

# Scroll through existing workspaces with mainMod + scroll
bindd = $mainMod, mouse_down, Workspaces: Next workspace, workspace, e+1
bindd = $mainMod, mouse_up, Workspaces: Previous workspace, workspace, e-1

# Move/resize windows with mainMod + LMB/RMB and dragging
bindmd = $mainMod, mouse:272, Windows: Drag to move, movewindow
bindmd = $mainMod, mouse:273, Windows: Drag to resize, resizewindow

# Laptop multimedia keys for volume and LCD brightness
bindeld = , XF86AudioRaiseVolume, Media: Volume up, exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+
bindeld = , XF86AudioLowerVolume, Media: Volume down, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindeld = , XF86AudioMute, Media: Mute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindeld = , XF86AudioMicMute, Media: Mute microphone, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindeld = , XF86MonBrightnessUp, Media: Brightness up, exec, brightnessctl -e4 -n2 set 5%+
bindeld = , XF86MonBrightnessDown, Media: Brightness down, exec, brightnessctl -e4 -n2 set 5%-

# Requires playerctl
bindld = , XF86AudioNext, Media: Next track, exec, playerctl next
bindld = , XF86AudioPause, Media: Play or pause, exec, playerctl play-pause
bindld = , XF86AudioPlay, Media: Play or pause, exec, playerctl play-pause
bindld = , XF86AudioPrev, Media: Previous track, exec, playerctl previous

##############################
### WINDOWS AND WORKSPACES ###
##############################

# See https://wiki.hypr.land/Configuring/Window-Rules/ for more
# See https://wiki.hypr.land/Configuring/Workspace-Rules/ for workspace rules

# Example windowrules that are useful

windowrule {
    # Ignore maximize requests from all apps. You'll probably like this.
    name = suppress-maximize-events
    match:class = .*

    suppress_event = maximize
}

windowrule {
    # Fix some dragging issues with XWayland
    name = fix-xwayland-drags
    match:class = ^$
    match:title = ^$
    match:xwayland = true
    match:float = true
    match:fullscreen = false
    match:pin = false

    no_focus = true
}

# Hyprland-run windowrule
windowrule {
    name = move-hyprland-run

    match:class = hyprland-run

    move = 20 monitor_h-120
    float = yes
}

# Flameshot window rules
windowrule {
    name = flameshot

    match:class = flameshot

    move = 0 0
    pin = true
    float = yes
    fullscreen = yes
}

# Zen browser transparency — translucent whole window, like the terminal.
# Hyprland's global blur (decoration > blur) gives the frosted-glass effect.
# Tune the number below: lower = more see-through (0.75 matches Ghostty).
windowrule {
    name = zen-transparency

    match:class = ^zen$

    opacity = 0.85 0.85
}

# Keep fullscreen Zen (videos, presentations) fully opaque.
windowrule {
    name = zen-fullscreen-opaque

    match:class = ^zen$
    match:fullscreen = true

    opacity = 1.0 1.0
}

# Frosted mako notifications — mako's background is ~90% opaque (theme
# mako.conf); ignore_alpha keeps the blur off the fully transparent corners.
layerrule {
    name = mako-blur

    match:namespace = notifications

    blur = on
    ignore_alpha = 0.3
}

# Bring up the systemd graphical-session.target so xdg-desktop-portal starts.
# Without this, the portal's `Requisite=graphical-session.target` is never met and
# opening external URLs (e.g. from Obsidian/Flatpak) silently fails.
exec-once = systemctl --user start hyprland-session.target
exec-once = hyprpaper & sleep 2 && hyprctl hyprpaper preload "$HOME/.config/hypr/wallpapers/darksouls.png" ; hyprctl hyprpaper wallpaper "HDMI-A-1,$HOME/.config/hypr/wallpapers/darksouls.png"
exec-once = /usr/lib/polkit-kde-authentication-agent-1
exec-once = wl-paste --type text --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store
exec-once = hypridle
bindd = $mainMod SHIFT, V, Apps: Clipboard history, exec, cliphist list | wofi --dmenu | cliphist decode | wl-copy
