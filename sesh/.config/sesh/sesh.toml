# sesh — smart tmux session manager / switcher.
# Picker is bound to <prefix>+s in ~/.tmux.conf. Pairs with zoxide for recent dirs.
# Layouts are built by ~/.local/bin/tmux-dev-layout (shared with `wt-session`),
# so there are no per-project/per-worktree layout files to maintain.

[default_session]
# Any dir/worktree picked that has no explicit entry below gets the standard layout.
startup_command = "tmux-dev-layout {}"
preview_command = "eza --all --icons --color=always {}"

[[session]]
name = "dotfiles"
path = "~/projects/personal/dotfiles"
startup_command = "tmux-dev-layout {}"

[[session]]
name = "prepahead"
path = "~/projects/personal/prepahead"
startup_command = "tmux-dev-layout {} 'dev||npm run dev'"

[[session]]
name = "equipx"
path = "~/projects/personal/EquipX"
startup_command = "tmux-dev-layout {} 'dev||npm run dev'"

[[session]]
name = "travelsmart"
# Claude pane opens in Frontend. Windows: dev (`npm run dev` in Frontend),
# backend (`make up` from the repo root to bring the stack up), docker
# (lazydocker to monitor the backend containers).
path = "~/projects/org/whitewolfstudios/travel-smart"
startup_command = "tmux-dev-layout {} --claude-dir {}/Frontend 'dev|Frontend|npm run dev' 'backend||make up' 'docker||lazydocker'"
