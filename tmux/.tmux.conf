set -g prefix C-f
unbind C-b
bind C-f send-prefix

set -g base-index 1
setw -g pane-base-index 1
unbind r
bind r source-file ~/.tmux.conf \; display "Reloaded!"
bind ` move-window -r

# sesh session picker (replaces the default choose-tree on <prefix>+s):
# Nord-themed fuzzy jump to any running session, configured project, or zoxide dir.
bind s display-popup -E -w 75% -h 75% "sesh-picker"

# wt-dev worktree switcher (<prefix>+w): pick which git worktree owns the dev
# stack. Only one worktree per project runs at a time — see `wt-dev --help`.
# The pill on the right of this status bar names whatever is currently live.
bind w display-popup -E -w 80% -h 60% "wt-dev pick"

# agent-sidebar (<prefix>+a this window, <prefix>+A every window of this session):
# a collapsible pane down the left listing every Claude session and what it is doing
# — the same state the picker sorts on (docs/agent-status.md), but glanced at rather
# than opened. It is read-only and spawned with `split-window -d`, so it never takes
# focus and can never eat a keystroke meant for the agent you are talking to.
#
# The window/session id is interpolated in rather than left for the script to look
# up: with two clients attached, tmux's idea of the "current" window is per-client,
# and the untargeted form would toggle a sidebar into someone else's window — the
# same trap pipeline-status documents.
bind a run-shell -b "agent-sidebar toggle #{window_id}"
bind A run-shell -b "agent-sidebar toggle-all #{session_id}"

# <prefix>+A sets @agent_sidebar_on on the session; this is what makes a window
# opened afterwards inherit it. Sessions that never opted in are unaffected, so this
# does not fire during tmux-dev-layout's window building at session creation.
set-hook -g after-new-window 'run-shell -b "agent-sidebar auto #{window_id}"'


set -g mouse on
set -g allow-rename off

# Clipboard: make mouse selection copy straight to the Wayland clipboard.
# With `mouse on`, tmux (not Ghostty) owns drag-selection, so Ghostty's native
# Ctrl+Shift+C has nothing to grab. These bindings pipe the selection to wl-copy
# the instant the drag ends — highlight, release, it's copied. Paste anywhere
# with Ghostty's Ctrl+Shift+V. `set-clipboard on` also lets `y` in copy-mode and
# programs inside tmux reach the same clipboard via OSC 52.
set -g set-clipboard on
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "wl-copy"
bind -T copy-mode    MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "wl-copy"
# `y` in copy-mode (keyboard selection) also yanks to the Wayland clipboard
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "wl-copy"
bind -T copy-mode    y send-keys -X copy-pipe-and-cancel "wl-copy"

# Slower mouse wheel scroll (default is 5 lines per tick, which feels jumpy)
bind -T copy-mode-vi WheelUpPane   send-keys -X -N 1 scroll-up
bind -T copy-mode-vi WheelDownPane send-keys -X -N 1 scroll-down
bind -T copy-mode    WheelUpPane   send-keys -X -N 1 scroll-up
bind -T copy-mode    WheelDownPane send-keys -X -N 1 scroll-down

set-option -g history-limit 100000

set-option -g set-titles on
set-option -g set-titles-string "#{pane_title}"

bind c new-window -c "#{pane_current_path}"
bind V split-window -h -c "#{pane_current_path}"
bind H split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %
unbind <
unbind >

# Cycle vertical split layout: 75|25 → 50|50 → 25|75 and back
# Logic lives in ~/.local/bin/tmux-cycle-layout because tmux expands #{format}
# strings before passing to run-shell, making complex inline scripts unreliable.
bind -r < run-shell "tmux-cycle-layout left"
bind -r > run-shell "tmux-cycle-layout right"


bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R


set-option -s escape-time 0

# Enable 24-bit truecolor passthrough (prevents tmux downsampling hex colors
# to 256-color, which washes out themed TUIs like lazygit). Ghostty's $TERM is
# xterm-ghostty, matched by the xterm* pattern below.
set -as terminal-features 'xterm*:RGB'

# Claude Code / pi: enable extended key reporting so Shift+Enter inserts a newline.
# extended-keys-format csi-u encodes modified keys in the modern CSI u format that
# TUIs (Claude Code, pi) prefer over the legacy xterm format.
set -s extended-keys on
set -g extended-keys-format csi-u
set -as terminal-features 'xterm*:extkeys'

# Claude Code: pass through escape sequences so notifications/progress bar reach Ghostty
set -g allow-passthrough on

# Forward terminal bells from panes so the window still carries tmux's bell flag.
setw -g monitor-bell on
set -g bell-action any
setw -g visual-bell off

# NO desktop notification on alert-bell. Claude Code rings the terminal bell every
# time a turn ends, so this hook fired a "tmux bell" popup at every turn boundary of
# a long autonomous run — one of the two reasons notifications felt random. Claude's
# genuine attention states now come from its own hooks (claude-hook-state, below),
# which can tell a turn ending apart from a session actually waiting on you. Bells
# from other programs still flag the window in the status bar; they just don't pop.
#
# The explicit unset matters: deleting a `set-hook` line does NOT remove the hook from
# an already-running server, and `prefix + r` only re-runs this file. Without this the
# old notification survives every reload until the tmux server itself restarts.
set-hook -gu alert-bell

# Claude status in the sesh picker (prefix+s). Claude Code's hooks
# (~/.claude/settings.json) all call `claude-hook-state`, which stamps four session
# options — @claude_state (working | blocked | waiting | done), @claude_pane,
# @claude_detail, @claude_ts. sesh-list-bells renders them as the picker's status
# column and sesh-preview as the banner on the ticket card.
#
# Only `blocked` (a permission prompt) and `waiting` (Notification/idle_prompt, ~60s
# after a turn ends with no input from you) are treated as alerts. `done` — the Stop
# hook, i.e. any turn ending — is deliberately NOT one: Stop fires between every
# frontend-pipeline stage, where Claude carries straight on to the next one.
#
# Clear the state the instant you look at the session; `sesh connect` switch-client
# fires client-session-changed too, so picking it in the picker clears it as well.
set-hook -g client-session-changed 'set-option -u @claude_state ; set-option -u @claude_detail'
set-hook -g client-attached 'set-option -u @claude_state ; set-option -u @claude_detail'

# Pass focus-in/focus-out events to pane applications (enables UI redraws on pane switch)
set -g focus-events on
#
# Styling
##

# Theme-driven status bar / pane styling. The whole styling block (colors +
# every line that uses them) is generated by `theme-switch` into
# ~/.config/theme/tmux.conf — tmux config vars are file-scoped, so definitions
# and usages must share one file. Reload after a switch: prefix + r.
if-shell '[ -f ~/.config/theme/tmux.conf ]' 'source-file ~/.config/theme/tmux.conf'
